<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#020409"/><stop offset="25%" stop-color="#050f24"/><stop offset="50%" stop-color="#0a2540"/><stop offset="75%" stop-color="#0284c7"/><stop offset="100%" stop-color="#00ff9d"/></linearGradient>
  <style>
    .w1{animation:w 7s ease-in-out infinite alternate}.w2{animation:w 9s ease-in-out infinite alternate-reverse}
    @keyframes w{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
    .rise{animation:r 1.2s ease-out both}.rise2{animation:r 1.2s .4s ease-out both}
    @keyframes r{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  </style></defs>
  <g class="w2"><path d="M0 0H1200V230C936.0 180 696.0 270 456.0 230S144.0 190 0 240Z" transform="translate(-60 0) scale(1.1 1)" fill="url(#g)" opacity=".45"/></g>
  <g class="w1"><path d="M0 0H1200V210C960.0 260 744.0 170 540.0 220S180.0 270 0 220Z" transform="translate(-60 0) scale(1.1 1)" fill="url(#g)"/></g>
  <text x="600" y="112.0" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff" stroke="#00f3ff" stroke-width="1" class="rise">Aloke K. Issac</text>
  <text x="600" y="158.0" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#00f3ff" class="rise2">AI Engineer | Machine Learning &amp; Reinforcement Learning | Full-Stack Developer</text>
</svg>