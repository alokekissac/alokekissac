<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff9d"/><stop offset="25%" stop-color="#0284c7"/><stop offset="50%" stop-color="#0a2540"/><stop offset="75%" stop-color="#050f24"/><stop offset="100%" stop-color="#020409"/></linearGradient>
  <style>
    .w1{animation:w 7s ease-in-out infinite alternate}.w2{animation:w 9s ease-in-out infinite alternate-reverse}
