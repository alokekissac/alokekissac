<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1a2b"/><stop offset="100%" stop-color="#050b14"/></linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace}.sans{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
      .route{stroke-dasharray:14 10;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .me{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{r:9}50%{r:14}}
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <g stroke="#1b2d44" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M80 160 H760"/><path d="M80 300 H760"/><path d="M80 440 H760"/><path d="M80 580 H760"/>
    <path d="M140 110 V640"/><path d="M300 110 V640"/><path d="M460 110 V640"/><path d="M620 110 V640"/>
    <path d="M300 300 L460 160"/>
  </g>
  <path d="M120 150 L720 110 L760 610 L100 640 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" opacity=".7"/>
  <g stroke="#22c55e" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M140 580 V440 H300 V300"/>
    <path d="M140 300 H300"/>
  </g>
  <g stroke="#f59e0b" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M460 580 H620" />
  </g>
  <path d="M300 300 L460 160 H620 V440 H460 V580" fill="none" stroke="#00f3ff" stroke-width="6" stroke-linecap="round" class="route" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="10" fill="#fff" stroke="#00f3ff" stroke-width="4" class="me"/>
  <rect x="820" y="110" width="400" height="500" rx="20" fill="#0a1424" stroke="#1d3a5c"/>
  <text x="850" y="170" class="sans" font-size="40" font-weight="800" fill="#f8fafc">Covigo</text>
  <text x="850" y="204" class="mono" font-size="16" font-weight="700" fill="#38bdf8">COVERAGE NAVIGATOR</text>
  <text x="850" y="262" class="mono" font-size="14" fill="#64748b">COVERAGE</text>
  <text x="850" y="304" class="sans" font-size="44" font-weight="800" fill="#22c55e">62%</text>
  <rect x="850" y="322" width="340" height="10" rx="5" fill="#15253a"/><rect x="850" y="322" width="211" height="10" rx="5" fill="#22c55e"/>
  <text x="850" y="380" class="mono" font-size="15" fill="#cbd5e1">✔ 18 streets done</text>
  <text x="850" y="412" class="mono" font-size="15" fill="#cbd5e1">→ 11 remaining</text>
  <text x="850" y="444" class="mono" font-size="15" fill="#f59e0b">⚠ 1 missed</text>
  <rect x="850" y="486" width="340" height="92" rx="12" fill="#0e1f33" stroke="#1d3a5c"/>
  <text x="870" y="518" class="mono" font-size="13" fill="#94a3b8">NEXT</text>
  <text x="870" y="552" class="sans" font-size="21" font-weight="700" fill="#f1f5f9">↱ Turn right in 40 m</text>
  <text x="80" y="690" class="mono" font-size="14" fill="#64748b">Illustration · street data from OpenStreetMap in the real app</text>
</svg>
