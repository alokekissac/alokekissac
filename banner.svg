<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#0a1a33"/><stop offset="60%" stop-color="#050b18"/><stop offset="100%" stop-color="#02050c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/><stop offset="55%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity=".55"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".08"/><stop offset="100%" stop-color="#00ff9d" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1426" stop-opacity=".95"/><stop offset="100%" stop-color="#050a16" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity=".35"/><stop offset="70%" stop-color="#00ff9d" stop-opacity=".12"/><stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e3b4f"/><stop offset="100%" stop-color="#062a22"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0f2340" stroke-width="1"/></pattern>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .dim{fill:#64748b}.cy{fill:#00f3ff}.gr{fill:#00ff9d}.wh{fill:#f1f5f9}.sk{fill:#38bdf8}.or{fill:#fb923c}.pu{fill:#c084fc}.yl{fill:#fde68a}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .spin{transform-origin:1150px 262px;animation:spin 18s linear infinite}
      .spinr{transform-origin:1150px 262px;animation:spin 26s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(700px)}}
      .l1{animation:type 0.6s .3s both}.l2{animation:type .6s .7s both}.l3{animation:type .6s 1.1s both}.l4{animation:type .6s 1.5s both}.l5{animation:type .6s 1.9s both}.l6{animation:type .6s 2.3s both}.l7{animation:type .6s 2.7s both}.l8{animation:type .6s 3.3s both}.l9{animation:type .6s 3.9s both}
      @keyframes type{from{opacity:0}to{opacity:1}}
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="800" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1440" height="800" rx="26" fill="url(#grid)" opacity=".45"/>
  <rect x="1.5" y="1.5" width="1437" height="797" rx="25" fill="none" stroke="url(#edge)" stroke-width="2"/>
