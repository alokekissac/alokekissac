    <text x="96" y="476" class="l6"><tspan class="sk">stack     </tspan><tspan class="wh">= [</tspan><tspan class="or">"Python"</tspan><tspan class="wh">, </tspan><tspan class="or">"PyTorch"</tspan><tspan class="wh">, </tspan><tspan class="or">"scikit-learn"</tspan><tspan class="wh">, </tspan><tspan class="or">"Flask"</tspan><tspan class="wh">, </tspan><tspan class="or">"JS"</tspan><tspan class="wh">]</tspan></text>
