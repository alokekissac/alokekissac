<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" width="100%">
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/><stop offset="35%" stop-color="#0284c7"/><stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1629"/><stop offset="100%" stop-color="#03070f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity=".7"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".1"/><stop offset="100%" stop-color="#00ff9d" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/><stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0e3b4f"/><stop offset="100%" stop-color="#062a22"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".09"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="90" y="300" width="380" height="540" rx="28"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00ff9d" flood-opacity=".18"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f2340" stroke-width="1"/></pattern>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .swing{transform-origin:280px 0px;animation:swing 6s ease-in-out infinite}
      @keyframes swing{0%,100%{transform:rotate(2.2deg)}50%{transform:rotate(-2.2deg)}}
      .spin{transform-origin:280px 470px;animation:spin 16s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .sweep{animation:sweep 4.5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-420px)}60%,100%{transform:translateX(420px)}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
  </defs>

  <g class="swing">
    <!-- strap -->
    <path d="M252 0 L308 0 L296 262 L264 262 Z" fill="url(#strap)" opacity=".9"/>
    <path d="M280 0 L280 258" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="5 6" opacity=".6"/>
    <!-- clip -->
    <rect x="252" y="252" width="56" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="266" y="262" width="28" height="22" rx="4" fill="#0b1220"/>
    <circle cx="280" cy="306" r="9" fill="#00ff9d" filter="url(#glow)"/>

    <!-- card -->
    <g filter="url(#shadow)">
      <rect x="90" y="300" width="380" height="540" rx="28" fill="url(#card)"/>
    </g>
    <g clip-path="url(#cardclip)">
      <rect x="90" y="300" width="380" height="540" fill="url(#grid)" opacity=".6"/>
      <rect x="90" y="300" width="160" height="540" fill="url(#sheen)" class="sweep"/>
    </g>
    <rect x="90" y="300" width="380" height="540" rx="28" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <rect x="236" y="322" width="88" height="14" rx="7" fill="#02050c" stroke="#1e293b"/>

    <circle cx="120" cy="352" r="5" fill="#00ff9d" class="pulse"/>
    <circle cx="440" cy="352" r="5" fill="#00f3ff" class="pulse"/>
    <text x="280" y="376" class="mono" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">AI ENGINEERING // DUBLIN</text>

    <!-- monogram -->
    <circle cx="280" cy="470" r="76" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="10 8" class="spin"/>
    <circle cx="280" cy="470" r="64" fill="url(#orb)" stroke="#00ff9d" stroke-width="3" filter="url(#glow)"/>
    <text x="280" y="489" class="sans" font-size="50" font-weight="800" fill="url(#neon)" text-anchor="middle">AKI</text>

    <text x="280" y="586" class="sans" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">ALOKE K. ISSAC</text>
    <text x="280" y="614" class="mono" font-size="16" font-weight="700" fill="#00f3ff" text-anchor="middle" letter-spacing="2">@alokekissac</text>
    <rect x="142" y="630" width="276" height="34" rx="9" fill="#052a22" stroke="#00ff9d" stroke-opacity=".8"/>
    <text x="280" y="653" class="mono" font-size="14.5" font-weight="800" fill="#00ff9d" text-anchor="middle" letter-spacing="2.5">AI ENGINEER</text>

    <line x1="126" y1="684" x2="434" y2="684" stroke="#1e3a5f"/>
    <g class="mono" font-weight="700">
      <text x="128" y="708" font-size="11" fill="#64748b" letter-spacing="2">DIVISION</text>
      <text x="128" y="728" font-size="15" fill="#f1f5f9">MACHINE LEARNING</text>
      <text x="306" y="708" font-size="11" fill="#64748b" letter-spacing="2">BASE</text>
      <text x="306" y="728" font-size="15" fill="#00ff9d">DUBLIN, IE</text>
      <text x="128" y="758" font-size="11" fill="#64748b" letter-spacing="2">SPECIALTY</text>
      <text x="128" y="778" font-size="15" fill="#00f3ff">ML · RL · WEB</text>
      <text x="306" y="758" font-size="11" fill="#64748b" letter-spacing="2">DEGREE</text>
      <text x="306" y="778" font-size="15" fill="#f1f5f9">MSc AI · DBS</text>
    </g>
    <!-- barcode -->
    <g fill="#e2e8f0">
      <rect x="150" y="796" width="4" height="26"/><rect x="158" y="796" width="2" height="26"/><rect x="164" y="796" width="6" height="26" fill="#00f3ff"/><rect x="174" y="796" width="2" height="26"/><rect x="180" y="796" width="4" height="26"/><rect x="188" y="796" width="8" height="26"/><rect x="200" y="796" width="2" height="26" fill="#00ff9d"/><rect x="206" y="796" width="4" height="26"/><rect x="214" y="796" width="2" height="26"/><rect x="220" y="796" width="6" height="26"/><rect x="230" y="796" width="3" height="26" fill="#00f3ff"/><rect x="237" y="796" width="5" height="26"/><rect x="246" y="796" width="2" height="26"/><rect x="252" y="796" width="7" height="26"/><rect x="263" y="796" width="3" height="26" fill="#00ff9d"/><rect x="270" y="796" width="2" height="26"/><rect x="276" y="796" width="6" height="26"/><rect x="286" y="796" width="3" height="26"/><rect x="293" y="796" width="5" height="26" fill="#00f3ff"/><rect x="302" y="796" width="2" height="26"/><rect x="308" y="796" width="8" height="26"/><rect x="320" y="796" width="3" height="26"/><rect x="327" y="796" width="2" height="26" fill="#00ff9d"/><rect x="333" y="796" width="6" height="26"/><rect x="343" y="796" width="2" height="26"/><rect x="349" y="796" width="4" height="26"/><rect x="357" y="796" width="7" height="26" fill="#00f3ff"/><rect x="368" y="796" width="2" height="26"/><rect x="374" y="796" width="5" height="26"/><rect x="383" y="796" width="3" height="26"/><rect x="390" y="796" width="6" height="26" fill="#00ff9d"/><rect x="400" y="796" width="2" height="26"/><rect x="406" y="796" width="4" height="26"/>
    </g>
  </g>
</svg>
